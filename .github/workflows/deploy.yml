name: deploy

# main -> build once -> staging (automatic) -> production (manual approval).
#
# AWS access is OIDC only (no keys). Until the repository variable
# AWS_DEPLOY_ROLE_ARN exists, every AWS job is skipped and the run stays
# green, so the pipeline can live in the repo before any AWS account does.
# Setup: deploy/README.md -> "First-time setup".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  aws-not-configured:
    if: vars.AWS_DEPLOY_ROLE_ARN == ''
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice title=Deploy skipped::Repository variable AWS_DEPLOY_ROLE_ARN is not set, so no AWS deploy ran. See deploy/README.md."

  build:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built once and saved as an artifact; every environment pushes these
      # exact bytes to its own registry, so prod runs what staging tested.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          tags: orderflow:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 7

  staging:
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: staging
      github-environment: staging

  production:
    needs: staging
    uses: ./.github/workflows/deploy-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: prod
      github-environment: production
