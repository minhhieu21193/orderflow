name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  TERRAFORM_VERSION: "1.17.0"
  TFLINT_VERSION: "v0.65.0"
  CHECKOV_VERSION: "3.3.30"
  TRIVY_VERSION: "v0.76.1"

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test -race ./...

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: orderflow:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /healthz and /readyz
        run: |
          docker run -d --name api -p 8080:8080 --read-only orderflow:ci
          for path in /healthz /readyz; do
            curl -fsS --retry 10 --retry-all-errors --retry-delay 1 "http://127.0.0.1:8080${path}"
            echo
          done
          docker rm -f api
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: orderflow:ci
          severity: CRITICAL
          exit-code: "1"

  terraform-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive deploy/terraform
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint (every module and root)
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the ruleset
        run: |
          tflint --init --config "$PWD/deploy/terraform/.tflint.hcl"
          tflint --recursive --chdir=deploy/terraform --config "$PWD/deploy/terraform/.tflint.hcl"

  terraform:
    name: terraform (${{ matrix.root }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, envs/staging, envs/prod]
    defaults:
      run:
        working-directory: deploy/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      # No backend and no credentials: nothing here can reach an AWS account.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: checkov
        run: |
          pipx install "checkov==${CHECKOV_VERSION}"
          checkov -d . --config-file "$GITHUB_WORKSPACE/deploy/terraform/.checkov.yaml"
