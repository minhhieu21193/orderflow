name: deploy-env

# Deploys the image built by deploy.yml to one environment:
# push to ECR (git SHA tag) -> render task definition -> update service ->
# wait for steady state -> smoke test /healthz through the ALB.
#
# The job runs in a GitHub Environment, so the OIDC token's subject is
# repo:<owner>/<repo>:environment:<name> - the only subject that env's deploy
# role trusts - and the Environment's protection rules (e.g. required
# reviewers on production) gate it. vars.AWS_DEPLOY_ROLE_ARN resolves to the
# Environment-level value when one is set.

on:
  workflow_call:
    inputs:
      env:
        description: Terraform env name (staging or prod); resources are orderflow-<env>.
        required: true
        type: string
      github-environment:
        description: GitHub Environment to run in.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.github-environment }}
      url: ${{ steps.smoke.outputs.url }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      NAME: orderflow-${{ inputs.env }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$NAME:$IMAGE_TAG"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Tags are immutable: a re-run finds the image already there.
          if aws ecr describe-images --repository-name "$NAME" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$image already exists"
            exit 0
          fi
          docker load --input "$RUNNER_TEMP/image.tar"
          docker tag "orderflow:$IMAGE_TAG" "$image"
          docker push "$image"

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition-family: ${{ env.NAME }}
          container-name: api
          image: ${{ steps.push.outputs.image }}

      - name: Deploy and wait for steady state
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.NAME }}
          service: ${{ env.NAME }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke test /healthz through the ALB
        id: smoke
        run: |
          dns=$(aws elbv2 describe-load-balancers --names "$NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)
          url="http://$dns"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # -L follows the HTTP->HTTPS redirect when a certificate is configured.
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 6 --max-time 10 "$url/healthz"
